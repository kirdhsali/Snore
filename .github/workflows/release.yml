# Tags each new version when it lands on main, and creates a GitHub release.
# The version comes from package.json; bump it (and js/version.js) to release.
name: Tag release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  # The same fast checks as CI, so nothing untested is published even if CI was skipped.
  test:
    name: Tests before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: for f in js/*.js scripts/*.js tests/*.js; do node --check "$f"; done
  tag:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the package.json version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "$v is already tagged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "Snorewatch $v"
          git push origin "$v"
          gh release create "$v" --title "Snorewatch $v" --generate-notes

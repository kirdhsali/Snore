name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: CI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

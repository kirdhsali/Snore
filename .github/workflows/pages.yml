# Publishes the app to GitHub Pages (https, so the microphone works on phones).
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages
# Deploys whatever the repository's default branch is.
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # The same fast checks as CI, so nothing untested is published even if CI was skipped.
  test:
    name: Tests before deploy
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: for f in js/*.js scripts/*.js tests/*.js; do node --check "$f"; done
  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site and stamp the build
        run: |
          mkdir -p site && cp -r index.html css js site/
          short=${GITHUB_SHA::7}
          sed -i "s/build: 'dev'/build: '$short'/" site/js/version.js
          # Cache-busting so phones load the new scripts right after a deploy
          sed -i -E "s/(src|href)=\"(js|css)\/([^\"]+)\"/\1=\"\2\/\3?v=$short\"/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
